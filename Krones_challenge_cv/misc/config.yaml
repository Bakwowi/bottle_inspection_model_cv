# =============================================================================
# Bottle Inspection - Master Configuration
# =============================================================================

project:
  name: "bottle_inspection"
  version: "1.0.0"
  seed: 42

# =============================================================================
# LABEL DEFINITIONS & BINARY MAPPING
# =============================================================================
labels:
  # Always GOOD regardless of area
  good:
    - "embossing"
    - "foam_residue"
    - "no_fault"
    - "water_drop"

  # FAULTY only if area exceeds threshold (pixels)
  conditionally_faulty:
    air_bubble:         500
    chip:               200
    contamination_light: 180
    glass_imperfection: 100
    scuffing:           75000
    scuffing_heavy:     1200

  # Always FAULTY regardless of area
  faulty:
    - "break_crack"
    - "circlip"
    - "contamination_dark"
    - "crown_cap"
    - "foil_semitransparent"
    - "foreign_object_manual"
    - "foreign_object_washing"
    - "glass_shard"
    - "insect"
    - "label"
    - "liquid"
    - "mold"
    - "no_base_visible"
    - "paint_residue"
    - "straw"
    - "yeast_residue"

# Binary mapping for model output
# 0 = GOOD (usable), 1 = FAULTY (reject)
binary_classes:
  good: 0
  faulty: 1

# =============================================================================
# DATA
# =============================================================================
data:
  root_dir: "data/raw"
  processed_dir: "data/processed"
  annotation_file: "data/annotations.csv"   # columns: image_path, label, area_px

  # Train / Val / Test split (stratified)
  split_ratios:
    train: 0.70
    val:   0.15
    test:  0.15

  # DataLoader
  num_workers: 8
  pin_memory: true
  prefetch_factor: 2

# =============================================================================
# IMAGE PROCESSING & ROI
# =============================================================================
image:
  # Raw capture dimensions (adjust to your camera)
  raw_width:  2048
  raw_height: 2048

  # ROI crop — circular bottle base detection params
  roi:
    method: "hough_circle"          # hough_circle | fixed | contour
    fixed_center: [1024, 1024]      # used only if method == fixed
    fixed_radius: 900               # used only if method == fixed
    hough_dp: 1.2
    hough_min_dist: 500
    hough_param1: 100               # Canny upper threshold
    hough_param2: 40                # accumulator threshold
    hough_min_radius: 600
    hough_max_radius: 1000
    margin_px: 20                   # padding outside detected circle
    fallback_to_fixed: true         # use fixed if detection fails

  # Final model input
  input_size: 224                   # 224×224

  # Normalization (ImageNet stats — pretrained backbone)
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]

  # CLAHE contrast enhancement
  clahe:
    enabled: true
    clip_limit: 2.0
    tile_grid_size: [8, 8]

# =============================================================================
# AUGMENTATION  (training only)
# =============================================================================
augmentation:
  enabled: true

  # Geometric — bottle base is rotationally symmetric → full 360° flip/rotate OK
  random_rotation:
    enabled: true
    degrees: 180               # full rotation

  horizontal_flip:
    enabled: true
    p: 0.5

  vertical_flip:
    enabled: true
    p: 0.5

  random_resized_crop:
    enabled: true
    scale: [0.85, 1.0]
    ratio: [0.95, 1.05]

  # Photometric
  color_jitter:
    enabled: true
    brightness: 0.2
    contrast: 0.2
    saturation: 0.1
    hue: 0.02

  gaussian_blur:
    enabled: true
    kernel_size: 3
    sigma: [0.1, 1.5]
    p: 0.3

  # Regularization augmentations
  coarse_dropout:            # simulates small occlusions
    enabled: true
    max_holes: 4
    max_height: 24
    max_width:  24
    p: 0.3

  gaussian_noise:
    enabled: true
    std: 0.02
    p: 0.25

  # Advanced: grid distortion simulates slight lens/vibration artifacts
  grid_distortion:
    enabled: true
    num_steps: 5
    distort_limit: 0.15
    p: 0.2

# =============================================================================
# MODEL
# =============================================================================
model:
  backbone: "efficientnet_b0"       # efficientnet_b0 | mobilenet_v3_small | resnet50
  pretrained: true
  num_classes: 1                    # binary → sigmoid output

  head:
    dropout1: 0.4
    hidden_dim: 256
    dropout2: 0.2
    # Output: Dense(1) + Sigmoid

  # Label smoothing for head training
  label_smoothing: 0.05

# =============================================================================
# TRAINING
# =============================================================================
training:
  epochs: 50
  batch_size: 64
  accumulate_grad_batches: 1        # effective batch = batch_size × this

  # Two-phase fine-tuning
  phase1:
    epochs: 8                       # head-only warmup
    lr: 1.0e-3
    freeze_backbone: true

  phase2:
    epochs: 42                      # full fine-tune
    lr: 1.0e-4
    freeze_backbone: false
    unfreeze_layers: "last3blocks"  # last3blocks | all

  optimizer:
    name: "adamw"
    weight_decay: 1.0e-4
    betas: [0.9, 0.999]
    eps: 1.0e-8

  scheduler:
    name: "cosine_with_warmup"
    warmup_epochs: 3
    min_lr: 1.0e-7
    t_mult: 1

  # Loss
  loss:
    name: "focal"                   # focal | bce | weighted_bce
    focal_gamma: 2.0
    focal_alpha: 0.75               # weight for positive (faulty) class; tune to your imbalance ratio

  # Class imbalance — set pos_weight for weighted BCE or use focal
  # pos_weight is computed automatically from dataset stats if set to "auto"
  pos_weight: "auto"

  # Mixed precision
  amp: true                         # automatic mixed precision (fp16)

  # Gradient clipping
  gradient_clip_val: 1.0

  # Early stopping
  early_stopping:
    enabled: true
    monitor: "val_f1"
    patience: 10
    min_delta: 0.0005
    mode: "max"

  # Checkpointing
  checkpoint:
    save_top_k: 3
    monitor: "val_f1"
    mode: "max"
    dirpath: "checkpoints/"

# =============================================================================
# THRESHOLD CALIBRATION
# =============================================================================
threshold:
  method: "f1_maximization"         # f1_maximization | precision_recall_tradeoff | fixed
  fixed_value: 0.5                  # used only if method == fixed
  # Minimum recall on FAULTY class — safety constraint
  min_recall_faulty: 0.990

# =============================================================================
# EVALUATION
# =============================================================================
evaluation:
  batch_size: 128
  tta_enabled: false                 # test-time augmentation (optional, adds latency)
  tta_n_augmentations: 5

  metrics:
    - "f1"
    - "precision"
    - "recall"
    - "accuracy"
    - "roc_auc"
    - "pr_auc"
    - "confusion_matrix"
    - "classification_report"

  # Export
  export_predictions: true
  export_path: "outputs/predictions.csv"

# =============================================================================
# LOGGING
# =============================================================================
logging:
  logger: "wandb"                   # wandb | tensorboard | csv
  project: "bottle_inspection"
  log_every_n_steps: 10
